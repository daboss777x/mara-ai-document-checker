[project]
name = "mara"
version = "0.1.0"
description = "Mara service (Modal): document checks, client portal API, EgoSMS sender, hourly sweep."
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal",
    "fastapi",
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "anthropic",
    "pyyaml>=6.0.4",
    "python-docx>=1.2.0",
    "pypdf>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pgserver",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mara"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
