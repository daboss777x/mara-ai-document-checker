<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff – Approval queue – mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../../assets/cs-ui-light.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1a5cc6}a{color:#1745a8}a:hover{color:#0b1f4d}</style>
</helmet>
<div class="scene" style="width: 390px; height: 900px; padding: 16px; display: flex; flex-direction: column; gap: 14px">

  <header class="glass" style="border-radius: 999px; height: 56px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <span class="serif" style="font-size: 22px">Approvals</span>
    <span class="chip c-check">{{pos}}</span>
  </header>

  <sc-if value="{{hasItem}}" hint-placeholder-val="{{ true }}">
    <article class="panel" style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; gap: 10px; align-items: center">
        <span class="mav" aria-hidden="true">M</span>
        <div class="faint" style="font-size: 12.5px; font-weight: 600">{{cur.kind}} · {{cur.deal}}</div>
      </div>
      <h1 class="serif" style="margin: 0; font-size: 32px; line-height: 1.05">{{cur.title}}</h1>
      <div style="font-size: 13.5px"><span class="muted">To:</span> <strong>{{cur.to}}</strong> · {{cur.channel}}</div>
      <div style="padding: 14px; border-radius: 16px; background: #ffffff; border: 1px solid #dbe4f3; font-size: 14.5px; line-height: 1.55">{{cur.body}}</div>
      <p class="muted" style="margin: 0; font-size: 13.5px">Why: {{cur.why}}</p>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
        <button type="button" class="btn" onClick="{{approve}}" style="height: 52px; font-size: 15px">Approve &amp; send</button>
        <div style="display: flex; gap: 8px">
          <button type="button" class="btn2" style="flex: 1">Edit</button>
          <button type="button" class="btn2 btnbad" onClick="{{skip}}" style="flex: 1">Reject</button>
        </div>
      </div>
    </article>
  </sc-if>
  <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
    <div class="panel" style="flex: 1; padding: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#12924f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
      <div class="serif" style="font-size: 34px">You're all caught up.</div>
      <button type="button" class="btn3" onClick="{{reset}}">Start the demo again</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var self = this;
    var list = [
      { kind: 'Message', deal: 'Barton Hills', title: 'Text Enoch about 3 missing documents', to: 'Enoch Omunu', channel: 'SMS', why: 'Pre-approval due Wed; 2 documents unsigned.', body: 'Hi Enoch, it’s Mara from Cedar & Stone Realty. We just need 3 more things from you. It takes about 5 minutes: [portal link]. Getting these in today keeps your Dec 19 closing on track. Reply STOP to opt out.' },
      { kind: 'Message', deal: 'Rainey St', title: 'Remind Priya about the HOA documents', to: 'Priya & Dev Shah', channel: 'SMS', why: 'HOA documents due to buyer Tue, Nov 25.', body: 'Hi Priya, it’s Mara from Cedar & Stone. The HOA documents for 44 Rainey St are due to the buyer tomorrow. Upload them here: [portal link]. Reply STOP to opt out.' },
      { kind: 'Message', deal: 'Cherrywood', title: 'Ask the lender for a loan update', to: 'Jordan Lee', channel: 'Email', why: 'No lender reply in 4 days.', body: 'Hi Jordan, checking in on Marcus Bell’s loan for 3310 Cherrywood Rd. The financing deadline is Wed, Dec 3. Where does underwriting stand?' }
    ];
    var i = this.state.i;
    var cur = list[i] || list[0];
    var next = function () { self.setState({ i: self.state.i + 1 }); };
    return {
      cur: cur,
      hasItem: i < list.length,
      empty: i >= list.length,
      pos: i < list.length ? (i + 1) + ' of ' + list.length : 'Done',
      approve: next,
      skip: next,
      reset: function () { self.setState({ i: 0 }); }
    };
  }
}
</script>
</body>
</html>
