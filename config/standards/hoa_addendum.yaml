key: hoa_addendum
name: HOA addendum
required_signatures:
  - key: buyer_signature
    description: The buyer has signed the addendum.
    severity: blocker
    client_fix_text: "Please sign the 'Buyer' line, then upload it again."
  - key: seller_signature
    description: The seller has signed the addendum.
    severity: blocker
    client_fix_text: "The seller's signature is missing. Your agent will follow up."
required_initials:
  - key: initials_each_page
    description: Buyer initials appear at the bottom of every page.
    severity: warning
    client_fix_text: "Please initial the bottom of every page, then upload it again."
required_dates:
  - key: buyer_signed_date
    description: The buyer's signature has a date next to it.
    severity: blocker
    client_fix_text: "Please write today's date next to your signature, then upload it again."
required_fields:
  - key: hoa_name
    description: The name of the homeowners association is filled in.
    severity: blocker
    client_fix_text: "The HOA's name is blank. Please fill it in and upload again."
  - key: hoa_fees
    description: The HOA fee amount and how often it is paid are filled in.
    severity: blocker
    client_fix_text: "The HOA fee amount is blank. Please fill it in and upload again."
other_rules:
  - key: all_pages_present
    description: Every page is included and readable.
    severity: blocker
    client_fix_text: "Some pages look missing or cut off. Please upload every page in one file."
